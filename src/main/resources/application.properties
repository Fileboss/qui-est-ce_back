quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=validate

quarkus.flyway.migrate-at-start=true

quarkus.http.limits.max-body-size=5M

quarkus.smallrye-openapi.store-schema-directory=target/generated/swagger

# --- Dev Services (dev + test only) ---
%dev.quarkus.datasource.devservices.reuse=true

game.bucket.name=game-images
quarkus.s3.devservices.enabled=true
quarkus.s3.devservices.buckets=game-images
# Pin LocalStack: the :latest tag was switched to a pro-licensed image in 2026-05
# and exits with code 55 (license check) inside Quarkus dev services. The v3 line
# is the community/free image — bump explicitly if a newer version is required.
quarkus.aws.devservices.localstack.image-name=localstack/localstack:3

# OIDC via Keycloak
quarkus.oidc.client-id=qui-est-ce-back
quarkus.oidc.application-type=service

# Dev Services: auto-provision Keycloak and import our realm
quarkus.keycloak.devservices.realm-path=realm-export.json
quarkus.keycloak.devservices.port=8180

# --- Production profile ---

# HTTP
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=8080

# PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}

# S3 / MinIO
%prod.quarkus.s3.devservices.enabled=false
%prod.quarkus.s3.aws.region=${S3_REGION:us-east-1}
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY}
%prod.quarkus.s3.endpoint-override=${S3_ENDPOINT}
%prod.quarkus.s3.path-style-access=true
# Public, https URL used to build image links returned to the browser. The
# S3_ENDPOINT above is the internal Docker hostname (http://minio:9000), which
# is unreachable from browsers and triggers mixed-content under https.
%prod.game.image.public-base-url=${S3_PUBLIC_BASE_URL}

# OIDC (setting auth-server-url also disables Keycloak Dev Services)
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
# Reject tokens that don't carry our audience claim. The qui-est-ce-front client
# injects aud=qui-est-ce-back via the backend-audience mapper; tokens minted for
# other clients in the realm (e.g. qui-est-ce-admin) will fail authentication here.
%prod.quarkus.oidc.token.audience=qui-est-ce-back

# WARNING: do NOT enable quarkus.http.access-log for /ws/* with the default format —
# the WS handshake URI carries ?access_token=<jwt>. If access logs are needed, set
# quarkus.http.access-log.exclude-pattern=^/ws/.* or use a format that omits the query string.

# Keycloak Admin Client (service account / client_credentials)
# In dev/test the same `qui-est-ce-back` client carries admin powers (single-client realm).
# In prod, a dedicated `qui-est-ce-admin` client holds those powers — see realm-export-prod.json.
quarkus.keycloak.admin-client.server-url=http://localhost:8180
quarkus.keycloak.admin-client.realm=qui-est-ce
quarkus.keycloak.admin-client.client-id=qui-est-ce-back
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS
%dev.quarkus.keycloak.admin-client.client-secret=dev-secret
%test.quarkus.keycloak.admin-client.client-secret=dev-secret

%prod.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
%prod.quarkus.keycloak.admin-client.client-id=qui-est-ce-admin
%prod.quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_ADMIN_SECRET}

