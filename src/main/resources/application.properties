quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.database.generation=validate

quarkus.flyway.migrate-at-start=true

quarkus.http.limits.max-body-size=5M

quarkus.smallrye-openapi.store-schema-directory=target/generated/swagger

# --- Dev Services (dev + test only) ---
%dev.quarkus.datasource.devservices.reuse=true

game.bucket.name=game-images
quarkus.s3.devservices.enabled=true
quarkus.s3.devservices.buckets=game-images

# OIDC via Keycloak
quarkus.oidc.client-id=qui-est-ce-back
quarkus.oidc.application-type=service

# Dev Services: auto-provision Keycloak and import our realm
quarkus.keycloak.devservices.realm-path=realm-export.json
quarkus.keycloak.devservices.port=8180

# --- Production profile ---

# HTTP
%prod.quarkus.http.host=0.0.0.0
%prod.quarkus.http.port=8080

# PostgreSQL
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}

# S3 / MinIO
%prod.quarkus.s3.devservices.enabled=false
%prod.quarkus.s3.aws.region=${S3_REGION:us-east-1}
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY}
%prod.quarkus.s3.endpoint-override=${S3_ENDPOINT}
%prod.quarkus.s3.path-style-access=true

# OIDC (setting auth-server-url also disables Keycloak Dev Services)
%prod.quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
%prod.quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}

# Keycloak Admin Client (service account / client_credentials)
quarkus.keycloak.admin-client.server-url=http://localhost:8180
quarkus.keycloak.admin-client.realm=qui-est-ce
quarkus.keycloak.admin-client.client-id=qui-est-ce-back
quarkus.keycloak.admin-client.client-secret=dev-secret
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

%prod.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
%prod.quarkus.keycloak.admin-client.client-secret=${OIDC_CLIENT_SECRET}

